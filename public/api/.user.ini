; Best-effort perf hints for this directory only — shared hosts vary in
; whether they honor per-directory php.ini overrides at all, and OPcache
; itself may already be on and locked at the server level. If neither
; directive takes effect here, PHP simply ignores it; harmless either way.
opcache.enable=1
opcache.memory_consumption=64
opcache.max_accelerated_files=4000
opcache.revalidate_freq=2
opcache.validate_timestamps=1
