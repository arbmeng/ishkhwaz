; LiteSpeed's LSAPI hard_timeout (a watchdog separate from PHP's own
; max_execution_time/set_time_limit) defaults on this host to just 2 seconds
; -- any request that blocks on external I/O (like the OpenAI calls in
; /ai/write and /ai-cv/*) longer than that gets silently SIGKILLed, which
; bypasses every PHP-level error/exception/shutdown handler entirely (the
; process just dies mid-request with zero trace). Raised here so real,
; legitimately-slower-than-2s API calls can actually complete.
hard_timeout = 60
max_execution_time = 60
