    <style>
      /* PWA safe-area: handled by the sticky header itself via paddingTop: max(12px, env(safe-area-inset-top)).
         Do NOT add padding-top here — it would double-stack with the header's own safe-area padding
         and push content out from under the notch/camera cutout on installed PWAs. */
      body { padding-bottom: env(safe-area-inset-bottom); }

      /* Belt-and-suspenders zoom lock. The viewport meta's user-scalable=no
         above is NOT enough by itself — iOS Safari (10+) deliberately ignores
         it for pinch gestures as an accessibility override, so this app kept
         being pinch-zoomable despite that meta tag. touch-action:manipulation
         is the CSS-level way to actually disable pinch-zoom and double-tap-
         zoom; the gesturestart/dblclick guards in the inline script below
         are the fallback for the iOS Safari versions that still ignore even this. */
      html, body { touch-action: manipulation; -ms-touch-action: manipulation; }
    </style>
    <script>
      // Pinch-zoom (Safari's proprietary gesture events) and rapid double-tap
      // zoom both bypass the viewport meta's user-scalable=no on iOS — this
      // is the documented workaround, not a hack: block the gesture events
      // directly and swallow same-target double-taps under 300ms.
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('gesturechange', (e) => e.preventDefault());
      document.addEventListener('gestureend', (e) => e.preventDefault());
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    </script>
